# 龙芯 Loongnix 桌面 20（稻香湖 DaoXiangHu）—— LoongArch **旧世界** ABI
#
# 与 25 线的关系：同一厂商的两条桌面线，ABI 互不兼容。世代判据落在动态链接器上，
# 不在架构名上（虽然这一支恰好名字也不同）：
#   /lib64/ld.so.1                         旧世界（本版本）
#   /lib64/ld-linux-loongarch-lp64d.so.1   新世界（25 线）
#
# 旧世界要求 QEMU ≥ 9。它的 glibc 2.28 仍在调 syscall 79/80，上游 QEMU 8.x 没实现，
# 症状是装载器报 `cannot stat shared object: Error 38`（ENOSYS），strace 下是
# `Unknown syscall 80`。而 Ubuntu 24.04 只带 8.2.2、没有 backports，所以构建与测试
# 两个阶段都要先跑 buildkit/tools/ensure-qemu.sh 换成钉住的 QEMU 10。
#
# 实测（本机 2026-09，带阴性对照）：同一份 20 线 bash，QEMU 8.2.2 报 Error 38，
# 换成 10.0.11 后正常跑出 MACHTYPE=loongarch64-unknown-linux-gnu；同一次换版之后
# 25 线的真产物照样能跑，所以换版对新世界无副作用。
DID=v20
DISPLAY_NAME="龙芯 Loongnix 桌面 20"
IMAGE=loongnix-v20
FAMILY=deb
METHOD=mmdebstrap

# suite 必须写 Codename：Release 自述 Origin/Label/Suite 都是 Debian，
# 只有 Codename 是 DaoXiangHu-stable。
MIRROR=https://pkg.loongnix.cn/loongnix/20/
SUITE=DaoXiangHu-stable
COMPONENTS="main contrib non-free"   # 这一代还没有 non-free-firmware

# 信任根与 25 线是同一把 key（两条线的 InRelease 都由它签）。
KEYRING_FILE=keys/loongnix-archive-keyring.gpg
KEYRING_KEY_FP=D1B8F4D3241F015CACF733D3A8C7C20CEDF1B817

USRMERGE=no                       # Debian 10 那一代还没做 usr-merge
ADMINDIR="var/lib/dpkg"

# ── 验收基线 ────────────────────────────────────────────────────────────────
# 从包里实读：libstdc++6 8.3.0 的 SO 是 libstdc++.so.6.0.25，最高符号版本
# GLIBCXX_3.4.25；glibc 2.28-10.lnd.38、gcc 8.3.0、dpkg 1.19.7。
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25
EXPECT_CXX=yes
EXPECT_OS_REPO=yes
EXPECT_SHADOW=0:42/640

REPACK_DEBS=""
STUB_PROVIDES=""
PIN_NEVER=""

# ── 三个档位 ────────────────────────────────────────────────────────────────
# 与 25 线同构，但去掉这一代没有的包：procps 在 Debian 10 里就叫 procps（同名），
# gpgv 同样要显式列出（gnupg 只 Recommends 它，而构建时关了 recommends）。
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,iputils-ping,lsof,zstd,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg,gpgv"
DEVEL_INCLUDE="build-essential,pkg-config"
