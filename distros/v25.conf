# 龙芯 Loongnix 桌面操作系统 25 —— LoongArch 新世界 ABI
#
# 为什么值得单独做：龙芯自己的容器 registry（cr.loongnix.cn）上能拉到的 loongnix
# 是 20.7，那是**上一代**——Debian 10 血统、loongarch64 旧世界 ABI，而桌面 25.1
# 没有对应容器镜像。两者名字完全一样、只差一个 tag，拿旧世界的镜像去验新世界的
# 交付根本不成立，而这个陷阱比「官方镜像是另一条产品线」更隐蔽。
#
# 世代判据落在动态链接器上，不在架构名上：
#   /lib64/ld-linux-loongarch-lp64d.so.1   新世界（本版本）
#   /lib64/ld.so.1                         旧世界（20 线）
# 实测：同一个 QEMU 8.2.2 下，新世界的 bash 正常跑出 MACHTYPE，旧世界的报
# `Unknown syscall 80`（ENOSYS）。上游 QEMU 不实现旧世界那两个调用，所以 20 线
# 在托管 runner 上造不出来——而且本项目只覆盖新世界，见 README。
DID=v25
DISPLAY_NAME="龙芯 Loongnix 桌面 25"
IMAGE=loongnix-v25
FAMILY=deb
METHOD=mmdebstrap                 # 标准 Debian 形状的公开签名仓库，现有路径直接可用

# ── 在线源 ──────────────────────────────────────────────────────────────────
# Release 自述 Origin/Label/Suite 都是 Debian、Codename 才是 loongnix-stable，
# 所以 suite 必须写 Codename 那一个。Architectures 只有 loong64。
MIRROR=https://pkg.loongnix.cn/loongnix/25/
SUITE=loongnix-stable
EXTRA_SUITES=loongnix-security    # 与 Debian 的 security 同性质，滚动更新
COMPONENTS="main contrib non-free non-free-firmware"

# 信任根。两条线的 InRelease 都由同一把 key 签（RSA 3072，2020-11-16，
# UID loongsonos <service@loongnix.cn>）。厂商把它打进了自己改的
# debian-archive-keyring_2019.1.lnd.3 的 /usr/share/keyrings/
# debian-archive-buster-loongarch64-stable.gpg；keys.openpgp.org 上同一指纹的
# UID 域名也是 loongnix.cn / loongson.cn，两个独立来源互相印证。
KEYRING_FILE=keys/loongnix-archive-keyring.gpg
KEYRING_KEY_FP=D1B8F4D3241F015CACF733D3A8C7C20CEDF1B817

USRMERGE=yes
ADMINDIR="var/lib/dpkg"

# ── 验收基线 ────────────────────────────────────────────────────────────────
# 从包里实读，不按 gcc 版本推：libstdc++6 14.2.0 的 SO 是 libstdc++.so.6.0.33，
# 最高符号版本 GLIBCXX_3.4.33。
# 注意 multiarch 三元组是 loongarch64-linux-gnu，而 deb 架构名是 loong64——
# 两者不同名，lib/arch.sh 已经做了映射。
EXPECT_GLIBC=2.41
EXPECT_LIBSTDCPP=6.0.33
EXPECT_GLIBCXX=3.4.33
EXPECT_CXX=yes
EXPECT_OS_REPO=yes

REPACK_DEBS=""
STUB_PROVIDES=""
PIN_NEVER=""

# ── 三个档位 ────────────────────────────────────────────────────────────────
# Priority: required 集是 39 个包，mmdebstrap 会自动带上，这里只列额外的。
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,iputils-ping,lsof,zstd,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg"
DEVEL_INCLUDE="build-essential,pkg-config"

# 影子文件的属主/权限，从镜像实测取值（deb 系是 root:shadow 0640）
EXPECT_SHADOW=0:42/640
