name: 构建镜像

# 下游仓库唯一的 workflow：只定义矩阵、调用 buildkit 的可复用 workflow。
# 改动前先读 buildkit/docs/downstream-repo.md 第四节。
#
# 这个仓库与其他三个的形状不同：**只有一个架构，而且没有托管 runner**。
# Loongnix 全线只有 LoongArch（实测每个 suite 的 Release 里 Architectures 字段：
# 25 线四个 suite 都是 loong64，20 线八个 suite 都是 loongarch64），所以不存在
# amd64/arm64 矩阵，三个档位全部靠 QEMU 用户态模拟。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "测试全绿后发布到 GHCR（默认不发布）"
        type: boolean
        default: false
      include-oldworld:
        description: "把 20 线（旧世界 loongarch64）一并构建。需要 QEMU ≥ 9，构建前会换版"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # LoongArch 没有托管 runner，只能在 amd64 上模拟。
  # runner 必须 24.04：LoongArch 的用户态模拟是 QEMU 7.1 才加的，Ubuntu 22.04 只带
  # 6.2，binfmt 里根本没有 qemu-loongarch64 条目。实测报错是「can neither be
  # executed natively nor via qemu user emulation」，那句话不提版本，很容易被当成
  # binfmt 没装。产物是 loong64 的，与宿主发行版新旧无关。
  build:
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distro-id:  v25
      arch:       loong64
      tier:       ${{ matrix.tier }}
      runner:     ubuntu-24.04
      needs-qemu: true
      # 模拟构建慢得多，devel 带 build-essential 更重。150 × 2 留在单 job 的
      # 6 小时上限内。
      timeout-minutes: 150
      max-attempts: 2

  # ── 20 线：旧世界 loongarch64 ────────────────────────────────────────────────
  # 与 25 线是两套互不兼容的 ABI，所以是独立的架构（loongarch64 对 loong64），
  # 发布时也走各自的平台名 —— 实测 docker 与 GHCR 都把这两个字符串当独立平台，
  # 推上去再回读一致，不会互相污染。
  #
  # 旧世界要求 QEMU ≥ 9：它的 glibc 2.28 仍在调 syscall 79/80，而 Ubuntu 24.04
  # 自带的 8.2.2 没实现，症状是 Unknown syscall 80 / ENOSYS。build-one 与 test-one
  # 会按目标架构调 tools/ensure-qemu.sh 换成钉住校验和的 QEMU 10。
  build-old:
    if: inputs.include-oldworld
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distro-id:  v20
      arch:       loongarch64
      tier:       \${{ matrix.tier }}
      runner:     ubuntu-24.04
      needs-qemu: true
      timeout-minutes: 150
      max-attempts: 2

  test:
    needs: [build]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distro-id:  v25
      arch:       loong64
      tier:       ${{ matrix.tier }}
      runner:     ubuntu-24.04   # 同上：22.04 的 QEMU 6.2 不支持 LoongArch
      needs-qemu: true           # 测试阶段也要 docker run 被测镜像，binfmt 两个阶段各需一次

  test-old:
    needs: [build-old]
    if: always() && inputs.include-oldworld
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distro-id:  v20
      arch:       loongarch64
      tier:       \${{ matrix.tier }}
      runner:     ubuntu-24.04
      needs-qemu: true

  # expected 是结构性守卫：某个 job 在跑到检查前就挂掉不会产出结果，检查总数会
  # 「合法地」变低而基线放过它，结果数对不上则一定抓得住。
  # 首轮按 3 份与保守基线跑，绿了之后按实际结果对齐（制度第 9 步）。
  report:
    needs: [test, test-old]
    if: always()
    uses: distrotwin/buildkit/.github/workflows/report.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distros:  \${{ inputs.include-oldworld && '["v25","v20"]' || '["v25"]' }}
      # 实测：3 份结果、119 项通过、零异常。本地 verify 报 122 是把每个镜像那条
      # 「不适用」的 gate_low 也计进了总数，而报告只数通过项，所以 119 = 122 - 3。
      # 基线取略低于实测的地板，掉下去说明有检查消失了。
      expected: \${{ inputs.include-oldworld && 6 || 3 }}
      baseline: \${{ inputs.include-oldworld && 225 || 115 }}

  publish:
    needs: [test, report]
    if: inputs.publish && needs.test.result == 'success' && needs.report.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: micro, latest: false }
          - { tier: base,  latest: false }
          - { tier: devel, latest: true }
    uses: distrotwin/buildkit/.github/workflows/publish-one.yml@f527e01da2aea0879e6929c674b28a2852d87ff5
    with:
      distro-id:  v25
      tier:       ${{ matrix.tier }}
      image:      loongnix
      tag-prefix: v25
      arches:     loong64
      latest:     ${{ matrix.latest }}
